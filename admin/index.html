<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-U3yarO8tnlLudeTiW9XHvqRD9bhCy/STfJgWeonfJLI='; style-src 'sha256-TXoYFM1OhjP6rYNYykt0IQGTKK2MXNxYk9gE5OarDQc='; img-src 'self' https:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>E Beetle หลังบ้านระบบประมูล</title>
<meta name="robots" content="noindex, nofollow">
<meta name="format-detection" content="telephone=no">

<link rel="icon" href="/e-beetle-auction/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/e-beetle-auction/apple-icon.png">
<style>/* หน้าทางเข้าถาวร: โทนเดียวกับหน้าลูกค้า (ค่าจาก DESIGN.md) — มือถือก่อน ไม่โหลดฟอนต์หรือไฟล์จากที่อื่น */
:root {
  --background: #f0eefa;
  --panel: #fdfcff;
  --foreground: #080909;
  --muted: #55565c;
  --line: #d6d3e6;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100svh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: var(--background);
  color: var(--foreground);
  font-family: "Noto Sans Thai", "Leelawadee UI", Thonburi, system-ui, sans-serif;
  font-size: 1.0625rem;
  line-height: 1.6;
}

main {
  width: 100%;
  max-width: 420px;
  padding: 32px 24px;
  border-radius: 28px;
  background: var(--panel);
  text-align: center;
}

.brand {
  margin: 0;
  font-size: 1.5rem;
  font-weight: 900;
  letter-spacing: -0.02em;
}

h1 {
  margin: 4px 0 24px;
  font-size: 1.125rem;
  font-weight: 600;
  color: var(--muted);
}

h2 {
  margin: 0 0 8px;
  font-size: 1.25rem;
  line-height: 1.4;
}

p {
  margin: 0 0 16px;
}

.loading,
.offline {
  display: none;
}

[data-state="loading"] .loading,
[data-state="offline"] .offline {
  display: block;
}

.spinner {
  display: block;
  width: 40px;
  height: 40px;
  margin: 0 auto 16px;
  border: 4px solid var(--line);
  border-top-color: var(--foreground);
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

@media (prefers-reduced-motion: reduce) {
  .spinner {
    animation-duration: 3s;
  }
}

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 52px;
  margin: 0 0 12px;
  padding: 0 20px;
  border: 2px solid var(--foreground);
  border-radius: 999px;
  background: var(--foreground);
  color: #fff;
  font: inherit;
  font-weight: 700;
  text-decoration: none;
  cursor: pointer;
}

.btn.outline {
  background: transparent;
  color: var(--foreground);
}

.btn:focus-visible,
.quiet:focus-visible {
  outline: 3px solid var(--foreground);
  outline-offset: 3px;
}

.quiet {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  color: var(--foreground);
}

/* ปุ่มและลิงก์ตั้งค่า display เอง จึงต้องบอกซ้ำว่าเมื่อถูกซ่อนให้ซ่อนจริง */
.btn[hidden],
.quiet[hidden] {
  display: none;
}</style>
</head>
<body data-state="idle">
<main>
<p class="brand">E Beetle</p>
<h1 data-admin="หลังบ้านระบบประมูล">หลังบ้านระบบประมูล</h1>
<div class="loading" role="status">
<span class="spinner" aria-hidden="true"></span>
<p data-admin="กำลังเปิดหลังบ้าน…">กำลังเปิดหลังบ้าน…</p>
</div>
<div class="offline">
<h2 data-admin="ตอนนี้ระบบปิดอยู่ชั่วคราว">ตอนนี้ระบบปิดอยู่ชั่วคราว</h2>
<p data-admin="กรุณาลองใหม่อีกครั้งภายหลัง">กรุณาลองใหม่อีกครั้งภายหลัง</p>
<button id="retry" type="button" class="btn">ลองอีกครั้ง</button>
<a class="btn outline" href="https://www.facebook.com/share/14q8LxbSTaR/" rel="noopener noreferrer" data-web-only hidden>เพจ E Beetle</a>
<a id="direct" class="quiet" href="#" hidden>ลองเปิดต่อโดยตรง</a>
</div>
<noscript><p>เบราว์เซอร์นี้ปิดการทำงานของสคริปต์ไว้ กรุณา<a href="https://stories-configuration-def-strict.trycloudflare.com">กดที่นี่เพื่อเปิดต่อ</a></p></noscript>
</main>
<script>// หน้าทางเข้าถาวร: อ่านว่าตอนนี้ระบบประมูลอยู่ที่ที่อยู่ไหน ตรวจว่าเปิดอยู่จริง แล้วพาไปที่นั่น
// เส้นทางและพารามิเตอร์ต่อท้ายถูกส่งต่อไปด้วย (…/auctions/<รหัส> ไปถึงหน้ารายการเดิม, …/admin/… ไปหลังบ้าน)
// ไฟล์นี้ถูกฝังลงในหน้า HTML ตอนสร้าง (scripts/lib/address.mjs) — /e-beetle-auction คือโฟลเดอร์ของเว็บบน GitHub Pages
(() => {
  const BASE = '/e-beetle-auction';
  const body = document.body;
  const direct = document.getElementById('direct');

  let path = location.pathname.startsWith(BASE) ? location.pathname.slice(BASE.length) : '/';
  const admin = /^\/admin(\/|$)/.test(path);
  if (admin) path = path.slice('/admin'.length);
  if (path === '' || path === '/index.html') path = '/';
  const rest = path + location.search + location.hash;

  // หน้าเดียวกันใช้กับทั้งลูกค้าและพนักงาน: ข้อความของหลังบ้านอยู่ใน data-admin
  if (admin) {
    for (const element of document.querySelectorAll('[data-admin]')) {
      element.textContent = element.dataset.admin;
    }
    for (const element of document.querySelectorAll('[data-web-only]')) element.hidden = true;
    document.title = document.querySelector('h1').textContent;
  }

  const show = (state) => body.setAttribute('data-state', state);

  // ระบบเปิดอยู่จริงหรือไม่: ลองโหลดรูปไอคอนของเว็บปลายทาง (ทำข้ามเว็บได้โดยไม่ต้องขอสิทธิ์พิเศษ)
  const reachable = (origin) =>
    new Promise((resolve) => {
      const image = new Image();
      const timer = setTimeout(() => resolve(false), 8000);
      const done = (ok) => {
        clearTimeout(timer);
        resolve(ok);
      };
      image.onload = () => done(true);
      image.onerror = () => done(false);
      image.src = `${origin}${admin ? '/apple-icon.png' : '/icon-192.png'}?t=${Date.now()}`;
    });

  async function open() {
    show('loading');
    direct.hidden = true;
    try {
      // ไฟล์บอกที่อยู่ปัจจุบัน — ใส่เวลาต่อท้ายกันการจำค่าเก่า เพราะที่อยู่เปลี่ยนทุกครั้งที่เปิดระบบใหม่
      const response = await fetch(`${BASE}/where.json?t=${Date.now()}`, { cache: 'no-store' });
      const where = await response.json();
      const origin = admin ? where.admin : where.web;
      if (where.status !== 'online' || !/^https:\/\/[a-z0-9.-]+$/i.test(origin ?? '')) {
        show('offline');
        return;
      }
      direct.href = origin + rest;
      if (await reachable(origin)) {
        location.replace(origin + rest);
        return;
      }
      direct.hidden = false;
      show('offline');
    } catch {
      show('offline');
    }
  }

  document.getElementById('retry').addEventListener('click', open);
  open();
})();</script>
</body>
</html>
